# Pre-commit: ruff + black + mypy (loose), per 07-TRACK-C-SERVE.md Phase 0.
# mypy is deliberately loose (see pyproject.toml) — this project's safety net is
# Pandera contracts and tests, not type ceremony.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        args: ["--ignore-missing-imports", "--no-strict-optional"]
        additional_dependencies: ["pandas-stubs>=2.2"]
        files: ^(contracts|ingest|features|models|evaluation|drift|registry|api|ops)/
