    <text x="300" y="118" font-size="64" font-weight="800" fill="#34d399">Bhao</text>
    <text x="74" y="176" font-size="21" fill="#94a3b8">What things cost in Pakistan, weekly &#8212; and what they&#8217;ll cost next week.</text>
    <g font-size="14.5">
