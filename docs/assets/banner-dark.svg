      <text x="284" y="226" fill="#f1f5f9" font-weight="600">867 series, weekly</text>
      <rect x="456" y="204" width="216" height="34" rx="17" fill="#1e293b"/>
      <text x="472" y="226" fill="#f1f5f9" font-weight="600">h=1 forecast + p10/p90</text>
