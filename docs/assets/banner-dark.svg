      <text x="700" y="226" fill="#f1f5f9" font-weight="600">every error published</text>
      <rect x="918" y="204" width="208" height="34" rx="17" fill="#1e293b"/>
      <text x="934" y="226" fill="#f1f5f9" font-weight="600">&#1575;&#1585;&#1583;&#1608; / English &#183; RTL</text>
    </g>
  </g>
  <g transform="translate(760,40)">
