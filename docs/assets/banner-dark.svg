    <g stroke="#1e293b" stroke-width="1">
      <line x1="18" y1="35" x2="342" y2="35"/><line x1="18" y1="75" x2="342" y2="75"/>
      <line x1="18" y1="115" x2="342" y2="115"/>
    </g>
    <path d="M18,108 L48,100 L78,104 L108,88 L138,96 L168,72 L198,84 L228,66 L258,74 L288,52" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <path d="M288,52 L342,34 L342,86 L288,66 Z" fill="url(#band)"/>
    <path d="M288,52 L342,34" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
    <path d="M288,66 L342,86" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
    <line x1="288" y1="59" x2="342" y2="59" stroke="#34d399" stroke-width="3"/>
    <circle cx="288" cy="59" r="4.5" fill="#34d399"/>
    <g font-size="12" fill="#94a3b8">
