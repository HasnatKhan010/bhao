    <rect x="950" y="340" width="220" height="100" rx="10" fill="#1e293b" stroke="#334155"/><rect x="950" y="340" width="4" height="100" rx="2" fill="#34d399"/><text x="966" y="368" font-size="15.5" font-weight="700" fill="#f1f5f9">Ops</text><text x="966" y="390" font-size="13.5" fill="#94a3b8">GH Actions weekly cron</text><text x="966" y="412" font-size="13.5" fill="#94a3b8">docker compose</text><text x="966" y="434" font-size="13.5" fill="#94a3b8">healthcheck on freshness</text>
