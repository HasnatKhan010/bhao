name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build:static
        env:
          STATIC_EXPORT: "1"
          # Point API to the deployed Render API (update this if you have your own)
          NEXT_PUBLIC_BHAO_API_URL: https://bhao-api.onrender.com

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check GitHub Pages status
        id: pages_status
        run: |
          status_code="$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")"

          if [ "$status_code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$status_code" = "404" ]; then
            echo "::warning::GitHub Pages is not enabled for ${{ github.repository }}. Skipping deployment."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Failed to check GitHub Pages status (HTTP $status_code)."
          cat /tmp/pages.json
          exit 1

      - name: Deploy to GitHub Pages
        if: steps.pages_status.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Skip deployment when Pages is disabled
        if: steps.pages_status.outputs.enabled != 'true'
        run: echo "GitHub Pages is disabled; deployment skipped."
