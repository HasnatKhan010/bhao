[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bhao"
version = "0.1.0"
description = "Bhao (بھاؤ) — what things cost in Pakistan, weekly, and what they'll cost next week."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bhao" }]
dependencies = [
    # --- data frames / storage / validation (Contract 1) ---
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "pyarrow>=16.0",
    "pandera>=0.20,<0.23",
    # --- ingest (Track A) ---
    "openpyxl>=3.1",
    "requests>=2.32",
    "python-dateutil>=2.9",
    # --- query / serve (Track C) ---
    "duckdb>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    # --- model (Track B) ---
    "lightgbm>=4.3",
    "statsmodels>=0.14.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    # --- calendar (Ramadan/Eid flags) ---
    "hijridate>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
tracking = ["mlflow>=2.14"]

[tool.setuptools.packages.find]
include = [
    "contracts*",
    "ingest*",
    "orchestration*",
    "features*",
    "models*",
    "evaluation*",
    "drift*",
    "registry*",
    "api*",
    "ops*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["web", "data", "docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "UP007", "UP045"]

[tool.black]
line-length = 100
extend-exclude = "web|.venv"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["web", "data", ".venv", "build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["contracts", "ingest", "features", "models", "evaluation", "drift", "registry", "api", "ops"]
